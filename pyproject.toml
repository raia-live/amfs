[project]
name = "amfs-workspace"
version = "0.0.0"
description = "AMFS workspace root"
requires-python = ">=3.11"

[tool.uv.workspace]
members = [
    "packages/core",
    "packages/adapters/filesystem",
    "packages/adapters/postgres",
    "packages/sdk-python",
    "packages/cli",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]

[tool.uv.sources]
amfs-core = { workspace = true }
amfs-adapter-filesystem = { workspace = true }
amfs = { workspace = true }

[tool.mypy]
python_version = "3.11"
strict = true
