[project]
name = "amfs-workspace"
version = "0.0.0"
description = "AMFS workspace root"
requires-python = ">=3.11"
license = "Apache-2.0"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "amfs-core",
    "amfs-adapter-filesystem",
    "amfs",
    "amfs-cli",
    "amfs-mcp-server",
]

[tool.uv.workspace]
members = [
    "packages/core",
    "packages/adapters/filesystem",
    "packages/adapters/postgres",
    "packages/adapters/s3",
    "packages/sdk-python",
    "packages/cli",
    "packages/mcp-server",
    "packages/http-server",
    "packages/connectors",
    "packages/integrations/crewai",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]

[tool.uv.sources]
amfs-core = { workspace = true }
amfs-adapter-filesystem = { workspace = true }
amfs = { workspace = true }
amfs-cli = { workspace = true }
amfs-mcp-server = { workspace = true }
amfs-http-server = { workspace = true }
amfs-connectors = { workspace = true }

[tool.mypy]
python_version = "3.11"
strict = true
