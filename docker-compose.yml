services:
  amfs:
    build: .
    image: ghcr.io/raia-live/amfs:latest
    command: ["--host", "0.0.0.0", "--port", "8080", "--with-cortex"]
    ports:
      - "8080:8080"
    environment:
      AMFS_POSTGRES_DSN: postgresql://amfs:amfs@postgres:5432/amfs
      AMFS_AGENT_ID: amfs-server
      AMFS_NAMESPACE: default
      # Uncomment to enable API key auth:
      # AMFS_API_KEYS: amfs_your_key_here
      # Pro SaaS connection (enables hot context, anticipation ranking):
      AMFS_PRO_URL: ${AMFS_PRO_URL:-}
      AMFS_PRO_API_KEY: ${AMFS_PRO_API_KEY:-}
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8080/health')"]
      interval: 15s
      timeout: 3s
      retries: 3

  postgres:
    # Pinned, not `pg16`. The floating tag moves, and the extension version
    # decides whether HNSW searches can be trusted: `hnsw.iterative_scan`
    # arrived in pgvector 0.8.0, and without it an HNSW index post-filters,
    # walking the global proximity graph and then discarding rows that fail the
    # WHERE clause. A query scoped to a small slice of a large table then gets
    # results that are missing rather than merely mis-ranked, which is the kind
    # of wrong answer nobody notices. Local, CI and Cloud SQL agreeing on one
    # version is the only way that stays true.
    image: pgvector/pgvector:0.8.1-pg16
    environment:
      POSTGRES_USER: amfs
      POSTGRES_PASSWORD: amfs
      POSTGRES_DB: amfs
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U amfs"]
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  pgdata:
