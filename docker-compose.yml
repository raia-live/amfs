services:
  amfs:
    build: .
    image: ghcr.io/raia-live/amfs:latest
    ports:
      - "8080:8080"
    environment:
      AMFS_POSTGRES_DSN: postgresql://amfs:amfs@postgres:5432/amfs
      AMFS_AGENT_ID: amfs-server
      AMFS_NAMESPACE: default
      # Uncomment to enable API key auth:
      # AMFS_API_KEYS: amfs_your_key_here
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8080/health')"]
      interval: 15s
      timeout: 3s
      retries: 3

  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: amfs
      POSTGRES_PASSWORD: amfs
      POSTGRES_DB: amfs
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U amfs"]
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  pgdata:
