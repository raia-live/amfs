[project]
name = "amfs-cortex"
version = "0.1.0"
description = "Memory Cortex — streaming digest compiler and briefing service for AMFS"
requires-python = ">=3.11"
license = "Apache-2.0"
dependencies = [
    "amfs-core",
    "amfs-adapter-postgres",
    "amfs",
    "networkx>=3.0",
]

[project.scripts]
amfs-cortex = "amfs_cortex.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/amfs_cortex"]
