[project]
name = "amfs-adapter-http"
version = "0.1.9"
description = "AMFS HTTP adapter — routes memory operations through the authenticated REST API"
requires-python = ">=3.11"
license = "Apache-2.0"
dependencies = [
    # 0.3.13 adds the capture fields this adapter now sends on the outcome record.
    "amfs-core>=0.3.13",
    "httpx>=0.27,<1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/amfs_adapter_http"]
