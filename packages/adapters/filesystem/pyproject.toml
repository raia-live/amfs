[project]
name = "amfs-adapter-filesystem"
version = "0.1.2"
description = "AMFS filesystem adapter with CoW via atomic rename"
requires-python = ">=3.11"
license = "Apache-2.0"
dependencies = [
    "amfs-core",
    # Keep this compatible with strands-agents>=1.0, which requires watchdog>=6:
    # a <5 cap makes the workspace (amfs-strands[strands] + this) unresolvable and
    # breaks Dependabot. Only the stable PollingObserver / events API is used here.
    "watchdog>=4.0,<7",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/amfs_filesystem"]
