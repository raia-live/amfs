[project]
name = "amfs-adapter-filesystem"
version = "0.1.2"
description = "AMFS filesystem adapter with CoW via atomic rename"
requires-python = ">=3.11"
license = "Apache-2.0"
dependencies = [
    "amfs-core",
    "watchdog>=4.0,<5",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/amfs_filesystem"]
