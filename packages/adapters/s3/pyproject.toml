[project]
name = "amfs-adapter-s3"
version = "0.1.6"
description = "AMFS adapter for S3-compatible object storage"
requires-python = ">=3.11"
license = "Apache-2.0"
dependencies = [
    "amfs-core>=0.3.35",
    "boto3>=1.34",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/amfs_s3"]
