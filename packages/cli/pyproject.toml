[project]
name = "amfs-cli"
version = "0.2.1"
description = "AMFS CLI — snapshot, inspect, and manage agent memory"
requires-python = ">=3.11"
license = "Apache-2.0"
dependencies = [
    "amfs",
    "typer>=0.12,<1",
    "rich>=13,<14",
    "httpx>=0.27",
]

[project.scripts]
amfs = "amfs_cli.main:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/amfs_cli"]
