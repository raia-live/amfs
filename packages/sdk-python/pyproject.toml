[project]
name = "amfs"
version = "0.5.1"
description = "AMFS Python SDK — Agent Memory File System"
requires-python = ">=3.11"
license = "Apache-2.0"
dependencies = [
    "amfs-core",
    "amfs-adapter-filesystem",
    "pyyaml>=6.0,<7",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/amfs"]
