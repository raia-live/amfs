[project]
name = "amfs-mcp-server"
version = "0.7.31"
description = "AMFS MCP Server — expose Agent Memory as MCP tools for Cursor and Claude Code"
requires-python = ">=3.11"
license = "Apache-2.0"
dependencies = [
    # Floored, not bare. amfs_commit_outcome forwards task_input to the SDK as a
    # keyword on every call, so an older amfs resolved from a cache would raise
    # TypeError on the one call agents are told to make at the end of every task.
    # An unbounded dependency is how the equivalent skew reached Pro users.
    # 0.5.7 adds AgentMemory.record_action, which amfs_record_action calls.
    # 0.5.13 is a real floor of exactly the kind the first paragraph describes:
    # amfs_briefing now passes credit_reuse=True, and AgentMemory.briefing only
    # accepts that keyword from 0.5.13. Below it, the call agents are told to
    # make FIRST in every session raises TypeError.
    # 0.5.14 adds AgentMemory.last_scope, which amfs_write reads to reuse the key
    # sample the server already computed instead of spending its own list() call.
    # Read through getattr, so an older pairing degrades to that extra list()
    # rather than breaking the write — which makes this floor the same shape as
    # the adapter one below: nothing raises, the scope block is just never there.
    "amfs>=0.5.22",
    # Direct floor at the import site. amfs_export and amfs_aggregate do
    # `from amfs_core.aggregates import coerce_value, iter_rows, aggregate_entries`.
    # Those were added in amfs-core 0.3.15 — but 0.3.14 was already published
    # WITHOUT them (the aggregate code merged without bumping core), so the
    # transitive floor via amfs (>=0.3.14) resolves a core that lacks the symbols
    # and the tool ImportErrors the instant it is called. Floor core directly so
    # a resolver can never pair this server with the broken 0.3.14 wheel.
    # 0.3.16 is the same hazard one degree quieter: iter_rows there flattens a
    # bare top-level array and accepts row_path=".". Against 0.3.15 that call
    # raises nothing — it looks in a dict, finds no key, and returns zero rows,
    # so amfs_export writes an empty file and the agent concludes the data has
    # no such shape. A silent empty result is worse than an ImportError, so this
    # floor is the only thing separating the two.
    # 0.3.17 is the exception to the pattern above: it adds
    # EmbedderABC.embed_batch, which this server never calls. The floor rises
    # because a floor below the version in this tree is what
    # test_dependency_floors forbids, not because anything here would break.
    # 0.3.19 is the same: nothing here reads the new core surface.
    # 0.3.22 likewise: SearchQuery grew include_descendants, and nothing here
    # sets it. The floor rises only because a floor below the version in this
    # tree is what test_dependency_floors forbids.
    "amfs-core>=0.3.32",
    # 0.1.10 for the same reason, one layer down: this adapter builds the
    # /outcomes body field by field, and anything earlier does not copy
    # tool_calls into it. The floor was 0.1.2, which a cached 0.1.9 satisfies —
    # and then every recorded action is dropped in transit, the server seals the
    # trace with an empty list, and the dataset built from those traces has
    # nothing to learn from. Nothing raises: the commit succeeds, and the only
    # symptom is a model that never becomes ready.
    # 0.1.13 is a real floor, not a bookkeeping one: it is the first release
    # whose commit_outcome keeps the server's memory_gap block, and 0.1.12
    # discards it. Paired with amfs>=0.5.11, which carries it from the adapter
    # to AgentMemory. Below either, amfs_commit_outcome reports no gap and looks
    # exactly like a session that had nothing to report.
    # 0.1.15 is bookkeeping in the same sense: the adapter learned to forward
    # include_descendants, which this server never asks for.
    # 0.1.16 sits between the two categories. It is the first adapter that
    # forwards credit_reuse, and AgentMemory retries without the keyword when
    # the adapter does not know it — so an older pairing does not raise, it just
    # silently books no reuse. Nothing fails; briefed entries simply stay at
    # recall_count 0 for ever, which is the exact bug this release closes and is
    # invisible from the outside. Floored so a resolver cannot reintroduce it.
    # 0.1.17 fails the same way, and is floored for the same reason. It is the
    # first adapter that asks the server for the scope block and keeps what comes
    # back; AgentMemory.last_scope reads it off the adapter with a getattr
    # default, so an older one yields None rather than raising, and amfs_write
    # falls back to its own list() call. The write still succeeds and still
    # returns a quality report — the scope block is simply never there, which is
    # indistinguishable from a scope that genuinely has no neighbours.
    "amfs-adapter-http>=0.1.25",
    "fastmcp>=2.0",
]

[project.scripts]
amfs-mcp-server = "amfs_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/amfs_mcp"]
