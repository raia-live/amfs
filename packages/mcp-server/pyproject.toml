[project]
name = "amfs-mcp-server"
version = "0.7.13"
description = "AMFS MCP Server — expose Agent Memory as MCP tools for Cursor and Claude Code"
requires-python = ">=3.11"
license = "Apache-2.0"
dependencies = [
    # Floored, not bare. amfs_commit_outcome forwards task_input to the SDK as a
    # keyword on every call, so an older amfs resolved from a cache would raise
    # TypeError on the one call agents are told to make at the end of every task.
    # An unbounded dependency is how the equivalent skew reached Pro users.
    # 0.5.7 adds AgentMemory.record_action, which amfs_record_action calls.
    "amfs>=0.5.7",
    "amfs-adapter-http>=0.1.2",
    "fastmcp>=2.0",
]

[project.scripts]
amfs-mcp-server = "amfs_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/amfs_mcp"]
