[project]
name = "amfs-http-server"
version = "0.3.17"
description = "AMFS HTTP/REST API server with SSE support"
requires-python = ">=3.11"
license = "Apache-2.0"
dependencies = [
    # The trace endpoints call amfs_core.capture and read/write task_input, and
    # 0.3.14 / 0.5.7 add the action half: scan_captured_arguments and ToolCall.
    "amfs>=0.5.10",
    "amfs-core>=0.3.18",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "sse-starlette>=2.0",
    "httpx>=0.27",
]

[project.optional-dependencies]
pro = ["amfs-patterns"]

[project.scripts]
amfs-http = "amfs_http.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/amfs_http"]
