[project]
name = "amfs-sprites"
version = "0.1.0"
description = "AMFS integration for Fly.io Sprites — auto-hydrate agent memory in disposable microVMs"
requires-python = ">=3.11"
license = "Apache-2.0"
dependencies = ["amfs>=0.5.8"]

# The HTTP adapter is only needed when pointing at hosted SenseLab (the common
# Sprites case). It's optional so the package also works against a local store.
optional-dependencies = { http = ["amfs-adapter-http>=0.1.6"] }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/amfs_sprites"]
