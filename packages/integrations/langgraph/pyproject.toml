[project]
name = "amfs-langgraph"
version = "0.1.0"
description = "AMFS integration for LangGraph"
requires-python = ">=3.11"
dependencies = ["amfs"]
optional-dependencies = { langgraph = ["langgraph>=0.0.30"] }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/amfs_langgraph"]
