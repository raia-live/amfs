[project]
name = "amfs-crewai"
version = "0.1.0"
description = "Use AMFS as CrewAI Memory storage backend"
requires-python = ">=3.11"
license = "Apache-2.0"
dependencies = [
    "amfs",
    "amfs-core",
]

[project.optional-dependencies]
crewai = ["crewai>=0.80"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/amfs_crewai"]
