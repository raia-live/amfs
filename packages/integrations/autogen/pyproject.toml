[project]
name = "amfs-autogen"
version = "0.1.0"
description = "AMFS integration for AutoGen"
requires-python = ">=3.11"
license = "Apache-2.0"
dependencies = ["amfs"]
optional-dependencies = { autogen = ["pyautogen>=0.2"] }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/amfs_autogen"]
