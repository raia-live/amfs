[project]
name = "amfs-langchain"
version = "0.1.0"
description = "AMFS integration for LangChain"
requires-python = ">=3.11"
dependencies = ["amfs"]
optional-dependencies = { langchain = ["langchain-core>=0.1"] }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/amfs_langchain"]
