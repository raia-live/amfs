[project]
name = "amfs-core"
version = "0.1.0"
description = "AMFS core models, engine, and adapter ABC"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.0,<3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/amfs_core"]
