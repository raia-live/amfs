[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "amfs-decision-runtime"
version = "0.1.0"
description = "Portable SenseLab decision scorer and reference inference server"
requires-python = ">=3.11"
license = "Apache-2.0"
dependencies = ["amfs-core>=0.3.30", "torch>=2.4", "transformers>=4.45", "safetensors>=0.4"]

[project.optional-dependencies]
server = ["fastapi>=0.110", "uvicorn>=0.30"]
adapters = ["peft>=0.13"]

[tool.hatch.build.targets.wheel]
packages = ["src/amfs_decision_runtime"]
