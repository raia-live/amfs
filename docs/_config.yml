title: AMFS
description: Agent Memory File System — shared, versioned memory for multi-agent AI systems
url: "https://raia-live.github.io"
baseurl: "/amfs"

remote_theme: just-the-docs/just-the-docs@v0.10.0

permalink: pretty

aux_links:
  GitHub: https://github.com/raia-live/amfs

aux_links_new_tab: true

nav_external_links: []

heading_anchors: true

search_enabled: true
search.heading_level: 3
search.previews: 3
search.preview_words_before: 5
search.preview_words_after: 10
search.tokenizer_separator: /[\s/]+/

color_scheme: nil

callouts:
  warning:
    title: Warning
    color: red
  note:
    title: Note
    color: blue
  tip:
    title: Tip
    color: green
  important:
    title: Important
    color: yellow

back_to_top: true
back_to_top_text: "Back to top"

footer_content: 'AMFS is licensed under <a href="https://github.com/raia-live/amfs/blob/main/LICENSE">Apache 2.0</a>. Copyright &copy; 2025 Bruno Andrade.'

last_edit_timestamp: true
last_edit_time_format: "%b %e %Y at %I:%M %p"

gh_edit_link: true
gh_edit_link_text: "Edit this page on GitHub"
gh_edit_repository: "https://github.com/raia-live/amfs"
gh_edit_branch: "main"
gh_edit_source: docs
gh_edit_view_mode: "tree"

plugins:
  - jekyll-seo-tag

exclude:
  - Gemfile
  - Gemfile.lock
  - node_modules
  - vendor
