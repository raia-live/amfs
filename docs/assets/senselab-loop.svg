<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="1200" height="420" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
  <defs>
    <marker id="tip" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#7367f0"/>
    </marker>
    <marker id="tipSmall" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#a8a3c9"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1200" height="420" fill="#ffffff"/>

  <text x="600" y="44" font-size="22" font-weight="700" fill="#2f2b3d" text-anchor="middle">The loop every run goes through</text>
  <text x="600" y="70" font-size="13.5" fill="#5c5870" text-anchor="middle">No prompt edit. No redeploy. The agent that runs next inherits what this one learned.</text>

  <!-- Return path: right edge, under the cards, back to the left -->
  <path d="M 1154 190 L 1176 190 L 1176 330 L 24 330 L 24 190 L 52 190"
        fill="none" stroke="#7367f0" stroke-width="2" marker-end="url(#tip)"/>
  <rect x="418" y="316" width="364" height="28" rx="14" fill="#ffffff" stroke="#7367f0" stroke-width="1.5"/>
  <text x="600" y="335" font-size="12.5" font-weight="600" fill="#7367f0" text-anchor="middle">NEXT RUN STARTS FROM HERE</text>

  <!-- Card 1 -->
  <rect x="60" y="112" width="242" height="156" rx="12" fill="#ffffff" stroke="#cdc8f5" stroke-width="1.5"/>
  <circle cx="84" cy="140" r="11" fill="#7367f0"/>
  <text x="84" y="144.5" font-size="12" font-weight="700" fill="#ffffff" text-anchor="middle">1</text>
  <text x="104" y="145" font-size="15" font-weight="700" fill="#2f2b3d">Get briefed</text>
  <text x="78" y="176" font-size="12.5" fill="#5c5870">amfs_briefing / retrieve.</text>
  <text x="78" y="196" font-size="12.5" fill="#5c5870">What is validated, what got</text>
  <text x="78" y="216" font-size="12.5" fill="#5c5870">discredited, which actions</text>
  <text x="78" y="236" font-size="12.5" fill="#5c5870">worked here before.</text>

  <!-- Card 2 -->
  <rect x="344" y="112" width="242" height="156" rx="12" fill="#ffffff" stroke="#cdc8f5" stroke-width="1.5"/>
  <circle cx="368" cy="140" r="11" fill="#7367f0"/>
  <text x="368" y="144.5" font-size="12" font-weight="700" fill="#ffffff" text-anchor="middle">2</text>
  <text x="388" y="145" font-size="15" font-weight="700" fill="#2f2b3d">Do the work</text>
  <text x="362" y="176" font-size="12.5" fill="#5c5870">Every read, write, decision</text>
  <text x="362" y="196" font-size="12.5" fill="#5c5870">and action lands in one</text>
  <text x="362" y="216" font-size="12.5" fill="#5c5870">decision trace. A failed</text>
  <text x="362" y="236" font-size="12.5" fill="#5c5870">attempt is marked as one.</text>

  <!-- Card 3 -->
  <rect x="628" y="112" width="242" height="156" rx="12" fill="#ffffff" stroke="#cdc8f5" stroke-width="1.5"/>
  <circle cx="652" cy="140" r="11" fill="#7367f0"/>
  <text x="652" y="144.5" font-size="12" font-weight="700" fill="#ffffff" text-anchor="middle">3</text>
  <text x="672" y="145" font-size="15" font-weight="700" fill="#2f2b3d">Commit the outcome</text>
  <text x="646" y="176" font-size="12.5" fill="#5c5870">Shipped, reverted, resolved,</text>
  <text x="646" y="196" font-size="12.5" fill="#5c5870">reopened. One call seals</text>
  <text x="646" y="216" font-size="12.5" fill="#5c5870">the trace with a verdict.</text>

  <!-- Card 4 -->
  <rect x="912" y="112" width="242" height="156" rx="12" fill="#ffffff" stroke="#cdc8f5" stroke-width="1.5"/>
  <circle cx="936" cy="140" r="11" fill="#7367f0"/>
  <text x="936" y="144.5" font-size="12" font-weight="700" fill="#ffffff" text-anchor="middle">4</text>
  <text x="956" y="145" font-size="15" font-weight="700" fill="#2f2b3d">Trust moves</text>
  <text x="930" y="176" font-size="12.5" fill="#5c5870">What a good run relied on</text>
  <text x="930" y="196" font-size="12.5" fill="#5c5870">gains confidence. What a bad</text>
  <text x="930" y="216" font-size="12.5" fill="#5c5870">run relied on loses it. A</text>
  <text x="930" y="236" font-size="12.5" fill="#5c5870">lesson is written.</text>

  <!-- Connectors -->
  <path d="M 306 190 L 336 190" fill="none" stroke="#a8a3c9" stroke-width="2" marker-end="url(#tipSmall)"/>
  <path d="M 590 190 L 620 190" fill="none" stroke="#a8a3c9" stroke-width="2" marker-end="url(#tipSmall)"/>
  <path d="M 874 190 L 904 190" fill="none" stroke="#a8a3c9" stroke-width="2" marker-end="url(#tipSmall)"/>

  <text x="600" y="392" font-size="13" fill="#5c5870" text-anchor="middle">The same mistake stops repeating. The same fix stops being rediscovered.</text>
</svg>
