name: Python Tests

  # Added ``dev`` because ``trigger-deploy.yml`` fires on a push to it: code was
  # deploying from a branch whose tests had never run. Every test added on a PR
  # into ``dev`` — the branch all work merges to — was inert until the eventual
  # promotion to ``main``, which is a long way from where it could still be cheap
  # to act on.
on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

# Both jobs only read the checkout: one runs the test suites, the other compares
# a version string across two commits. Neither writes to the repo, comments on a
# PR, or publishes anything, so read is the whole requirement — and the default
# token is far broader than that. Declared at the top rather than per job so a
# job added later inherits the narrow set instead of silently getting the wide
# one, which is how this was missed on the version gate.
permissions:
  contents: read

jobs:
  decision-runtime:
    name: Decision contracts and CPU runtime
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v4
      - name: Install isolated CPU runtime
        run: |
          uv venv --python 3.12 .venv
          uv pip install --python .venv/bin/python torch --index-url https://download.pytorch.org/whl/cpu
          uv pip install --python .venv/bin/python -e packages/core -e 'packages/decision-runtime[server,adapters]' pytest pytest-asyncio
      - name: Test contracts, offline artifacts and multi-model isolation
        run: .venv/bin/python -m pytest tests/decisions -q

  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]

    services:
      postgres:
        # pgvector's image, and a pinned version of it rather than the floating
        # `pg16` tag — the same one docker-compose.yml and the Helm values use,
        # for the reason spelled out there: `hnsw.iterative_scan` arrived in
        # pgvector 0.8.0, and without it an HNSW index post-filters, walking the
        # global proximity graph and then discarding rows that fail the WHERE
        # clause. A query scoped to a small slice of a large table then returns
        # results that are missing rather than merely mis-ranked. Local, CI and
        # Cloud SQL agreeing on one version is the only thing that keeps that
        # true, and CI was the one that did not.
        #
        # Plain `postgres:16` was not a smaller version of this. It ships no
        # pgvector at all, and the adapter opens by running `CREATE EXTENSION IF
        # NOT EXISTS vector` — so the vector paths could never have been
        # exercised here, whatever the job reported.
        image: pgvector/pgvector:0.8.1-pg16
        env:
          POSTGRES_DB: amfs_test
          POSTGRES_PASSWORD: test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4

      - name: Set up Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          uv venv .venv
          source .venv/bin/activate
          uv pip install -e packages/core -e packages/adapters/filesystem -e packages/adapters/postgres -e packages/sdk-python -e packages/cli -e packages/mcp-server -e packages/cortex -e packages/http-server
          uv pip install pytest pytest-asyncio pyyaml

      - name: Run unit tests
        run: |
          source .venv/bin/activate
          pytest tests/unit/ -v

      - name: Run integration tests (filesystem)
        run: |
          source .venv/bin/activate
          pytest tests/integration/test_filesystem_adapter.py -v

      - name: Run integration tests (postgres)
        env:
          AMFS_TEST_PG_DSN: postgresql://postgres:test@localhost:5432/amfs_test
        run: |
          source .venv/bin/activate
          pytest tests/integration/test_postgres_adapter.py -v

  # The hosted product builds these packages from this git tree, so a change here
  # reaches production whether or not it is ever published. Everything else reads
  # PyPI: amfs-mcp-server-pro pins published versions and is not in the hosted
  # image, and self-hosted and uvx users install from there too. So a merge that
  # edits package source without bumping the version ships to production and
  # silently skips every one of them, at the same version number.
  #
  # Four packages were in that state at once when this was added — core,
  # adapters/http, http-server and sdk-python — which is why this is a check
  # rather than a note to remember. amfs-internal has had the equivalent for
  # mcp-server-pro for a while; its absence here is the whole reason.
  version-bump:
    name: Changed packages need a version bump
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: A changed package needs a changed version
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          # The set auto-publish.yml actually publishes. A package absent from
          # that loop is absent here too, or this would demand a bump that no
          # workflow acts on.
          PKGS="packages/core packages/adapters/filesystem packages/adapters/postgres
                packages/adapters/s3 packages/adapters/http packages/http-server
                packages/sdk-python packages/cli packages/mcp-server
                packages/integrations/strands"
          stale=""
          for PKG in $PKGS; do
            if git diff --quiet "$BASE" "$HEAD" -- "$PKG/src"; then
              continue
            fi
            before=$(git show "$BASE:$PKG/pyproject.toml" \
              | sed -n 's/^version *= *"\(.*\)"/\1/p' | head -1)
            after=$(sed -n 's/^version *= *"\(.*\)"/\1/p' "$PKG/pyproject.toml" | head -1)
            if [ "$before" = "$after" ]; then
              echo "::error file=$PKG/pyproject.toml::$PKG/src changed but the \
          version is still $after. auto-publish.yml only fires when a \
          pyproject.toml changes on main, so this would merge unpublished and \
          every PyPI consumer would keep running $after without this change."
              stale="$stale $PKG"
            else
              echo "$PKG: $before -> $after"
            fi
          done
          if [ -n "$stale" ]; then
            echo "Packages needing a bump:$stale"
            exit 1
          fi
          echo "Every changed package carries a new version."
