name: TypeScript Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "20"

      - name: Install dependencies
        working-directory: packages/sdk-typescript
        run: npm install

      - name: Run tests
        working-directory: packages/sdk-typescript
        run: npm test

      - name: Type check
        working-directory: packages/sdk-typescript
        run: npx tsc --noEmit
