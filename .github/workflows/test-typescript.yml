name: TypeScript Tests

  # Added ``dev`` because ``trigger-deploy.yml`` fires on a push to it: code was
  # deploying from a branch whose tests had never run. Every test added on a PR
  # into ``dev`` — the branch all work merges to — was inert until the eventual
  # promotion to ``main``, which is a long way from where it could still be cheap
  # to act on.
on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        working-directory: packages/sdk-typescript
        run: npm install

      - name: Run tests
        working-directory: packages/sdk-typescript
        run: npm test

      - name: Type check
        working-directory: packages/sdk-typescript
        run: npx tsc --noEmit
